name: YouTube - avisos instantaneos y red de seguridad

# Los videos ya NO llegan por aqui en el caso normal: YouTube nos avisa al
# instante en /api/youtube (WebSub). Este workflow hace dos cosas:
#
#   1. Renueva la suscripcion. Caduca a los cinco dias y el hub deja de
#      avisar SIN decir nada, que es la peor forma de romperse.
#   2. Es la red debajo. WebSub es "mejor esfuerzo" y pierde avisos de vez
#      en cuando; el repaso de la mañana y la noche recoge lo que se cayo.
#
# Los dos caminos deduplican por videoId, asi que nada sale dos veces.
#
# Las horas de GitHub son UTC y Cuba cambia de hora en noviembre, asi que
# esto se corre a las 12:00 y 23:30 UTC: en verano son las 8:00 y las 19:30
# de Cuba, y en invierno las 7:00 y las 18:30. Una hora de diferencia media
# temporada no justifica montar nada mas complicado.
on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      seco:
        description: 'En seco: imprime lo que mandaria y NO lo manda'
        type: boolean
        default: false

concurrency:
  group: escritura-db
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_SECO: ${{ inputs.seco && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev

      # Primero renovar: si la suscripcion caduco, cuanto antes vuelva mejor.
      - name: Renovar la suscripcion instantanea
        run: npm run youtube:suscribir

      - name: Repaso por si se perdio algun aviso
        if: ${{ always() }}
        run: npm run youtube

      # Lo que quede en el outbox sale por WhatsApp tambien.
      - name: Enviar por WhatsApp
        if: ${{ always() }}
        run: npm run wa:enviar
