name: Guerra normal - sync y aviso

# Cada 2 horas, todo el mes.
#
# Una guerra normal dura 24h de preparacion + 24h de batalla, pero el
# detalle por jugador SOLO existe mientras /currentwar la devuelve: cuando
# empieza la siguiente, la anterior desaparece y el /warlog historico solo
# deja totales del clan, sin decir quien ataco. Una guerra que pase entera
# entre dos corridas se pierde y no se recupera.
#
# Corre tambien durante la CWL aunque entonces no haya guerras normales: el
# job responde "sin guerra ahora" en dos segundos y no cuesta nada. En un
# repo publico los minutos de Actions son ilimitados.
#
# Va a los :35 para no chocar con la CWL, que sale en punto: comparten el
# grupo de concurrencia y el segundo tendria que esperar.
on:
  schedule:
    - cron: '35 */2 * * *'
  workflow_dispatch:

concurrency:
  group: escritura-db
  cancel-in-progress: false

jobs:
  wars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A nivel de JOB y no de paso. Estaba colgando del ultimo paso, asi que
    # wars:sync corria sin COC_TOKEN ni base de datos; y el aviso nuevo se
    # habria quedado sin Telegram, que es justo lo que tiene que usar.
    env:
      COC_TOKEN: ${{ secrets.COC_TOKEN }}
      COC_BASE_URL: ${{ vars.COC_BASE_URL }}
      CLAN_TAGS: ${{ secrets.CLAN_TAGS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERTA_UMBRALES: ${{ vars.ALERTA_UMBRALES || '6,3,1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev

      - name: Sincronizar guerras
        run: npm run wars:sync

      # El aviso corre SIEMPRE, aunque el sync haya fallado: lee de la API
      # directo. Un fallo guardando datos no puede costar una guerra — que es
      # justo lo que pasaba, porque la CWL avisaba y la guerra normal no, y
      # ahi se desperdicia el 14,7% de los ataques contra el 0,8% de la CWL.
      - name: Aviso de ataques sin usar
        if: ${{ always() }}
        run: npm run guerra:alerta

      # Manda lo que haya quedado en el outbox.
      - name: Enviar por WhatsApp
        if: ${{ always() }}
        run: npm run wa:enviar
